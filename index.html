<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A.n.n Beauty SPA</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/logo.png?v=7"/>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Tailwind Config (paleta da marca) -->
  <script src="js/tailwind_config.js"></script>

  <style>
    * { box-sizing: border-box; }

  
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', 'Inter', sans-serif;
      background: #F6F5FB;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Loading spinner enquanto o app carrega */
    #app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #F6F5FB;
    }
    #app-loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #E8DDEF;
      border-top-color: #8B5FBF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #app-loading p {
      margin-top: 16px;
      color: #8B5FBF;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body>

  <!-- Área principal da SPA -->
  <div id="app">
    <div id="app-loading">
      <div class="spinner"></div>
      <p>Carregando A.n.n Beauty...</p>
    </div>
  </div>

  <!-- Entry point da SPA -->
  <script type="module" src="js/app.js?v=13"></script>

</body>
</html>
