<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Beleza na Web</title>
    <meta name="description" content="Beleza na Web — Skincare Etéreo & Rituais de Luxo. E-commerce de beleza premium com formulações clínicas e estética luminosa."/>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet"/>

    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <!-- Shared Styles -->
    <link href="css/styles.css" rel="stylesheet"/>

    <!-- Unified Tailwind Configuration -->
    <script src="js/tailwind_config.js"></script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

</head>
<body class="bg-background text-on-background min-h-screen antialiased">
    <div id="app">
        <!-- Loading state -->
        <div class="min-h-screen flex flex-col items-center justify-center gap-6 bg-surface-bright">
            <div class="relative">
                <div class="text-5xl font-serif text-primary tracking-tighter animate-pulse relative z-10">Beleza na Web</div>
                <div class="absolute -inset-4 bg-primary/5 blur-2xl rounded-full animate-pulse"></div>
            </div>
            <div class="flex flex-col items-center gap-2">
                <p class="text-on-surface-variant font-label-sm tracking-widest uppercase animate-bounce">Carregando</p>
                <div class="w-48 h-1 bg-surface-container rounded-full overflow-hidden">
                    <div class="w-full h-full bg-primary origin-left animate-[loading_2s_ease-in-out_infinite]"></div>
                </div>
            </div>
        </div>
    </div>
    <style>
        @keyframes loading {
            0% { transform: scaleX(0); }
            50% { transform: scaleX(1); }
            100% { transform: scaleX(0); transform-origin: right; }
        }
    </style>


    <!-- App Router -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
