<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>A.n.n Beauty - Criar Conta</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#54408c",
                        "on-primary": "#ffffff",
                        "primary-container": "#6d58a6",
                        "on-primary-container": "#e9deff",
                        "primary-fixed": "#e9ddff",
                        "primary-fixed-dim": "#cfbdff",
                        "on-primary-fixed": "#220458",
                        "on-primary-fixed-variant": "#4e3985",
                        "secondary": "#6c586d",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#f5daf4",
                        "on-secondary-container": "#725e73",
                        "secondary-fixed": "#f5daf4",
                        "secondary-fixed-dim": "#d8bfd8",
                        "on-secondary-fixed": "#251628",
                        "on-secondary-fixed-variant": "#534155",
                        "background": "#f8f9fa",
                        "on-background": "#191c1d",
                        "surface": "#f8f9fa",
                        "on-surface": "#191c1d",
                        "surface-variant": "#e1e3e4",
                        "on-surface-variant": "#494550",
                        "outline": "#7a7581",
                        "outline-variant": "#cac4d2",
                        "surface-bright": "#f8f9fa",
                        "surface-dim": "#d9dadb",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f3f4f5",
                        "surface-container": "#edeeef",
                        "surface-container-high": "#e7e8e9",
                        "surface-container-highest": "#e1e3e4",
                    },
                    fontFamily: {
                        "body": ["Plus Jakarta Sans"],
                        "display": ["Noto Serif"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .matte-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-[#121212] font-body text-on-background antialiased min-h-screen flex">
    <div class="flex w-full min-h-screen">
        <!-- Left Side: Imagery & Brand -->
        <div class="hidden lg:flex lg:w-1/2 relative bg-black overflow-hidden">
            <img alt="Maquiagem premium" class="absolute inset-0 w-full h-full object-cover opacity-60" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAQIrHNpD7xvPiQ4rJfvmtLWju0jcJD3LsqS7AW-RQBlNmMQ35BqepgdiZXIHb0lr7mhVP0NZ_ykCXjFDNIx8kQ0W6K1ovzh9KCUvXJfLFAyjT7c_9NoWxMBI8YH9M_EJ9g5BXdM97RTDCXqAZNx6PpduSLKp_qKbhT34m5Qmjhnu9_jwlRTbdDtYiuCKAqFGryI9pI31UOTzZujusotpCpq2683xr2cMEBxvQsVQA57oHIjCVUjyXiBH_-vy7QNzgYAWC88vPT8dOP"/>
            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent"></div>
            <div class="relative z-10 flex flex-col justify-end p-10 h-full w-full">
                <h1 class="font-display text-5xl text-white drop-shadow-lg mb-2">A.n.n Beauty</h1>
                <p class="font-display text-xl text-primary-fixed-dim italic opacity-90 drop-shadow-sm">
                    "A.n.n beauty não vende apenas 'maquiagem', mas sim autoestima."
                </p>
            </div>
        </div>

        <!-- Right Side: Sign Up Form -->
        <div class="w-full lg:w-1/2 flex items-center justify-center bg-[#121212] px-6 sm:px-12 py-12">
            <div class="w-full max-w-[460px] matte-card p-8 sm:p-10 rounded-3xl shadow-2xl">
                <div class="text-center mb-8">
                    <h2 class="font-display text-3xl text-primary-fixed mb-2">Criar Conta</h2>
                    <p class="text-white/60 text-sm">Junte-se à nossa comunidade exclusiva</p>
                </div>

                <!-- Tabs (Email / Phone) -->
                <div class="flex border-b border-white/10 mb-8" id="auth-tabs">
                    <button class="flex-1 pb-3 text-sm font-medium text-primary border-b-2 border-primary" onclick="switchTab('email')">E-mail</button>
                    <button class="flex-1 pb-3 text-sm font-medium text-white/40 border-b-2 border-transparent" onclick="switchTab('phone')">Telefone</button>
                </div>

                <form id="signupForm" class="space-y-4">
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-primary-fixed-dim material-symbols-outlined">person</span>
                        <input id="nome" class="w-full pl-12 pr-6 py-4 rounded-full bg-white/5 border border-white/10 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-white placeholder:text-white/30" placeholder="Nome completo" type="text" required/>
                    </div>

                    <!-- Email Reg -->
                    <div id="email-reg" class="space-y-4">
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-primary-fixed-dim material-symbols-outlined">mail</span>
                            <input id="email" class="w-full pl-12 pr-6 py-4 rounded-full bg-white/5 border border-white/10 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-white placeholder:text-white/30" placeholder="seu@email.com" type="email"/>
                        </div>
                    </div>

                    <!-- Phone Reg (Hidden by default) -->
                    <div id="phone-reg" class="hidden space-y-4">
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-primary-fixed-dim material-symbols-outlined">call</span>
                            <input id="phone" class="w-full pl-12 pr-6 py-4 rounded-full bg-white/5 border border-white/10 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-white placeholder:text-white/30" placeholder="(00) 00000-0000" type="tel"/>
                        </div>
                    </div>

                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-primary-fixed-dim material-symbols-outlined">lock</span>
                        <input class="w-full pl-12 pr-6 py-4 rounded-full bg-white/5 border border-white/10 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-white placeholder:text-white/30" placeholder="Criar senha" type="password" required/>
                    </div>

                    <p class="text-[10px] text-white/40 px-4 text-center leading-relaxed">
                        Ao se cadastrar, você concorda com nossos <a href="#" class="underline">Termos de Uso</a> e <a href="#" class="underline">Política de Privacidade</a>.
                    </p>

                    <button class="w-full py-4 mt-2 rounded-full bg-primary text-white font-bold shadow-lg shadow-primary/20 hover:bg-primary-container hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2" type="submit">
                        Cadastrar <span class="material-symbols-outlined text-sm">person_add</span>
                    </button>
                </form>

                <div class="relative flex items-center my-8">
                    <div class="flex-grow border-t border-white/10"></div>
                    <span class="px-4 text-xs text-white/30 uppercase tracking-widest">ou use social</span>
                    <div class="flex-grow border-t border-white/10"></div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button onclick="handleSocialLogin('Google')" class="flex items-center justify-center gap-2 py-3 px-4 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 transition-all">
                        <img src="https://www.google.com/favicon.ico" class="w-4 h-4" alt="Google"/>
                        <span class="text-xs text-white font-medium">Google</span>
                    </button>
                    <button onclick="handleSocialLogin('Facebook')" class="flex items-center justify-center gap-2 py-3 px-4 rounded-full bg-[#1877F2] hover:bg-[#166fe5] transition-all">
                        <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                        <span class="text-xs text-white font-medium">Facebook</span>
                    </button>
                </div>

                <p class="mt-8 text-center text-sm text-white/60">
                    Já tem uma conta? <a href="../login_a.n.n_beauty/code.html" class="text-primary-fixed-dim hover:text-primary underline underline-offset-4">Faça login</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function switchTab(type) {
            const emailReg = document.getElementById('email-reg');
            const phoneReg = document.getElementById('phone-reg');
            const buttons = document.querySelectorAll('#auth-tabs button');
            
            if (type === 'email') {
                emailReg.classList.remove('hidden');
                phoneReg.classList.add('hidden');
                buttons[0].classList.add('text-primary', 'border-primary');
                buttons[0].classList.remove('text-white/40', 'border-transparent');
                buttons[1].classList.remove('text-primary', 'border-primary');
                buttons[1].classList.add('text-white/40', 'border-transparent');
            } else {
                emailReg.classList.add('hidden');
                phoneReg.classList.remove('hidden');
                buttons[1].classList.add('text-primary', 'border-primary');
                buttons[1].classList.remove('text-white/40', 'border-transparent');
                buttons[0].classList.remove('text-primary', 'border-primary');
                buttons[0].classList.add('text-white/40', 'border-transparent');
            }
        }

        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            localStorage.setItem('ann_beauty_user', JSON.stringify({
                name: nome,
                email: 'user@example.com'
            }));
            window.location.href = '../index.html#/home';
        });

        function handleSocialLogin(provider) {
            alert(`Conectando ao ${provider}...`);
            setTimeout(() => {
                localStorage.setItem('ann_beauty_user', JSON.stringify({
                    name: `User ${provider}`,
                    email: `user@${provider.toLowerCase()}.com`
                }));
                window.location.href = '../index.html#/home';
            }, 1000);
        }
    </script>
</body>
</html>
